services:
  - type: web
    name: forex-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DATA_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
